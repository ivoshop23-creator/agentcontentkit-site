server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(jpg|png|pdf)$ { expires 7d; add_header Cache-Control "public"; }
    location = /10-ai-prompts-for-listings.pdf { add_header Content-Disposition 'attachment; filename="10-AI-Prompts-for-Listings.pdf"'; }
}
